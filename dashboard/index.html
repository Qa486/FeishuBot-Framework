<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feishu Bot Dashboard</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    nav { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 60px; gap: 32px; }
    nav .brand { font-size: 18px; font-weight: 700; color: var(--primary); }
    nav .brand span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
    nav .spacer { flex: 1; }
    nav .status-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--success); }
    nav .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    /* Login */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); }
    .login-box { background: var(--panel); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 360px; }
    .login-box h2 { margin-bottom: 24px; font-size: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius); font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: background 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-full { width: 100%; justify-content: center; }
    .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

    /* Dashboard grid */
    .dashboard { display: none; }
    .module-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
    .card { background: var(--panel); border-radius: var(--radius); box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .card-header h3 { font-size: 15px; }
    .card-header .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #e0e7ff; color: var(--primary); font-weight: 500; }
    .tag-success { background: #d1fae5 !important; color: var(--success) !important; }
    .tag-warning { background: #fef3c7 !important; color: var(--warning) !important; }
    .card-body { padding: 20px; }
    .card-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    .card-meta span { margin-right: 16px; }
    .card-actions { display: flex; gap: 8px; }

    /* Module detail panel */
    .panel { background: var(--panel); border-radius: var(--radius); box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-top: 24px; display: none; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .panel-header h3 { font-size: 16px; }
    textarea.config-editor { width: 100%; min-height: 400px; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; padding: 16px; border: none; resize: vertical; outline: none; background: #f9fafb; }
    .panel-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .btn-save { background: var(--success); color: #fff; }
    .btn-cancel { background: var(--border); color: var(--text); }
    .save-toast { position: fixed; bottom: 24px; right: 24px; background: var(--success); color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .save-toast.show { opacity: 1; }

    /* Status bar */
    .status-bar { background: var(--panel); border-radius: var(--radius); padding: 16px 20px; display: flex; gap: 32px; font-size: 13px; }
    .status-bar .item { display: flex; align-items: center; gap: 8px; }
    .status-bar .label { color: var(--text-muted); }
  </style>
</head>
<body>

<nav>
  <div class="brand">🤖 Feishu Bot<span>管理后台</span></div>
  <div class="spacer"></div>
  <div class="status-badge"><div class="status-dot"></div> Bot 在线</div>
</nav>

<div class="container">
  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h2>登录管理后台</h2>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-user" placeholder="admin" value="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">登录</button>
      <div class="login-error" id="login-error">用户名或密码错误</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="status-bar">
      <div class="item"><span class="label">运行状态</span><b style="color:var(--success)">● 在线</b></div>
      <div class="item"><span class="label">模块数量</span><b id="module-count">—</b></div>
      <div class="item"><span class="label">版本</span><b>1.0.0</b></div>
    </div>

    <div class="module-cards" id="module-cards"></div>

    <div class="panel" id="module-panel">
      <div class="panel-header">
        <h3 id="panel-title">模块配置</h3>
        <button class="btn btn-cancel" onclick="closePanel()">← 返回</button>
      </div>
      <textarea class="config-editor" id="config-editor"></textarea>
      <div class="panel-footer">
        <button class="btn btn-cancel" onclick="closePanel()">取消</button>
        <button class="btn btn-save" onclick="saveConfig()">💾 保存配置</button>
      </div>
    </div>
  </div>
</div>

<div class="save-toast" id="save-toast">✅ 配置已保存</div>

<script>
let currentModule = '';
let statusData = {};

async function doLogin() {
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  // In production, this should call /api/login with real credentials
  if (user && pass) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStatus();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    statusData = await res.json();
    renderModules(statusData.modules || {});
    document.getElementById('module-count').textContent = Object.keys(statusData.modules || {}).length;
  } catch (e) {
    console.error('Failed to load status', e);
  }
}

function renderModules(modules) {
  const container = document.getElementById('module-cards');
  container.innerHTML = '';
  const names = {
    auto_reply: '🔁 自动回复',
    scheduler: '📅 定时通知',
    survey: '📋 问卷调查',
    faq: '💬 FAQ 助手',
    forwarder: '🔄 消息转发'
  };
  const descs = {
    auto_reply: '关键词触发自动回复',
    scheduler: '每天定时推送消息到群或用户',
    survey: '创建投票和问卷调查',
    faq: '常见问题智能问答',
    forwarder: '跨群/跨用户消息转发'
  };

  Object.entries(modules).forEach(([name, data]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <h3>${names[name] || name}</h3>
        <span class="tag tag-success">已启用</span>
      </div>
      <div class="card-body">
        <div class="card-meta">${descs[name] || ''}</div>
        <div class="card-meta">
          <span>📊 ${Object.keys(data).length > 0 ? Object.values(data).join(' / ') : '运行中'}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary" onclick="openModule('${name}')">⚙️ 配置</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

async function openModule(name) {
  currentModule = name;
  try {
    const res = await fetch(`/api/modules/${name}/config`);
    const data = await res.json();
    document.getElementById('panel-title').textContent = name + ' — 配置';
    document.getElementById('config-editor').value = JSON.stringify(data, null, 2);
    document.getElementById('module-panel').style.display = 'block';
    document.getElementById('module-cards').style.display = 'none';
    document.querySelector('.status-bar').style.display = 'none';
  } catch (e) {
    alert('加载配置失败: ' + e.message);
  }
}

function closePanel() {
  document.getElementById('module-panel').style.display = 'none';
  document.getElementById('module-cards').style.display = 'grid';
  document.querySelector('.status-bar').style.display = 'flex';
}

async function saveConfig() {
  const raw = document.getElementById('config-editor').value;
  try {
    const data = JSON.parse(raw);
    await fetch(`/api/modules/${currentModule}/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    showToast('✅ 配置已保存，重启服务后生效');
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
}

function showToast(msg) {
  const el = document.getElementById('save-toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Enter key on login
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
